<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">xyanncat // AI Systems Architect</title>
  <desc id="desc">Futuristic cyber-agentic banner featuring glowing neural DAG nodes, constellation lines, and modern typography.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070814"/>
      <stop offset="45%" stop-color="#0d0e24"/>
      <stop offset="85%" stop-color="#141032"/>
      <stop offset="100%" stop-color="#0a0818"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="node-glow-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="node-glow-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="node-glow-3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-opacity="0.07" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#818cf8" fill-opacity="0.2"/>
    </pattern>

    <!-- Dot Matrix Pattern -->
    <pattern id="dot-matrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#a78bfa" fill-opacity="0.12"/>
    </pattern>

    <!-- Card Clip -->
    <clipPath id="banner-clip">
      <rect width="1280" height="360" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#banner-clip)">
    <!-- Base Background -->
    <rect width="1280" height="360" fill="url(#bg-grad)"/>
    <rect width="1280" height="360" fill="url(#cyber-grid)"/>
    <rect width="1280" height="360" fill="url(#dot-matrix)" opacity="0.6"/>

    <!-- Ambient Glow Orbs -->
    <circle cx="1080" cy="180" r="220" fill="url(#node-glow-1)"/>
    <circle cx="920" cy="100" r="160" fill="url(#node-glow-2)"/>
    <circle cx="1180" cy="280" r="180" fill="url(#node-glow-3)"/>
    <circle cx="160" cy="60" r="180" fill="url(#node-glow-1)" opacity="0.3"/>

    <!-- Cyber Decorative Circuit Lines (Background) -->
    <path d="M 0,40 L 400,40 L 440,80 L 700,80" fill="none" stroke="#8b5cf6" stroke-opacity="0.15" stroke-width="1.5"/>
    <path d="M 200,360 L 500,360 L 540,320 L 800,320" fill="none" stroke="#06b6d4" stroke-opacity="0.15" stroke-width="1.5"/>
    <circle cx="700" cy="80" r="3" fill="#8b5cf6" fill-opacity="0.4"/>
    <circle cx="800" cy="320" r="3" fill="#06b6d4" fill-opacity="0.4"/>

    <!-- Right Side: Complex Agentic DAG Graph / Neural Constellation -->
    <g transform="translate(40, 0)">
      <!-- Orbital Circles -->
      <circle cx="1000" cy="180" r="140" fill="none" stroke="#8b5cf6" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4,6"/>
      <circle cx="1000" cy="180" r="95" fill="none" stroke="#06b6d4" stroke-opacity="0.18" stroke-width="1.5"/>
      <ellipse cx="1000" cy="180" rx="170" ry="60" transform="rotate(-25 1000 180)" fill="none" stroke="url(#accent-grad)" stroke-opacity="0.35" stroke-width="1.5"/>
      <ellipse cx="1000" cy="180" rx="140" ry="50" transform="rotate(35 1000 180)" fill="none" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6,4"/>

      <!-- DAG Connection Vector Lines -->
      <line x1="880" y1="120" x2="960" y2="80" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5"/>
      <line x1="960" y1="80" x2="1080" y2="100" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5"/>
      <line x1="1080" y1="100" x2="1140" y2="170" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5"/>
      <line x1="880" y1="120" x2="1000" y2="180" stroke="#06b6d4" stroke-opacity="0.5" stroke-width="2"/>
      <line x1="1000" y1="180" x2="1140" y2="170" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="2"/>
      <line x1="1000" y1="180" x2="940" y2="260" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5"/>
      <line x1="940" y1="260" x2="1060" y2="280" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5"/>
      <line x1="1060" y1="280" x2="1140" y2="170" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5"/>
      <line x1="1000" y1="180" x2="1060" y2="280" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.5"/>

      <!-- Graph Nodes -->
      <!-- Central Core Node -->
      <circle cx="1000" cy="180" r="16" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2.5"/>
      <circle cx="1000" cy="180" r="6" fill="#a78bfa"/>
      
      <!-- Node: Planner (Cyan) -->
      <circle cx="880" cy="120" r="11" fill="#083344" stroke="#06b6d4" stroke-width="2"/>
      <circle cx="880" cy="120" r="4" fill="#67e8f9"/>
      <text x="880" y="145" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">PLANNER</text>

      <!-- Node: Researcher (Purple) -->
      <circle cx="960" cy="80" r="9" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
      <circle cx="960" cy="80" r="3" fill="#c084fc"/>

      <!-- Node: Coder (Cyan) -->
      <circle cx="1080" cy="100" r="10" fill="#083344" stroke="#06b6d4" stroke-width="2"/>
      <circle cx="1080" cy="100" r="3.5" fill="#67e8f9"/>
      <text x="1080" y="85" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">CODER</text>

      <!-- Node: Reviewer (Crimson) -->
      <circle cx="1140" cy="170" r="12" fill="#4c0519" stroke="#f43f5e" stroke-width="2"/>
      <circle cx="1140" cy="170" r="4" fill="#fb7185"/>
      <text x="1140" y="196" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">REVIEWER</text>

      <!-- Node: Memory Layer (Violet) -->
      <circle cx="940" cy="260" r="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
      <circle cx="940" cy="260" r="3.5" fill="#c4b5fd"/>
      <text x="940" y="285" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">5L-MEMORY</text>

      <!-- Node: Executor (Cyan) -->
      <circle cx="1060" cy="280" r="11" fill="#083344" stroke="#06b6d4" stroke-width="2"/>
      <circle cx="1060" cy="280" r="4" fill="#67e8f9"/>
      <text x="1060" y="305" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">EXECUTOR</text>

      <!-- Data Packets (Glowing dots along lines) -->
      <circle cx="930" cy="155" r="2.5" fill="#ffffff"/>
      <circle cx="1070" cy="175" r="2.5" fill="#ffffff"/>
      <circle cx="970" cy="220" r="2" fill="#67e8f9"/>
    </g>

    <!-- Left Side: Typography & Brand Identity -->
    <!-- Top Decorative Line & Status Indicator -->
    <g transform="translate(80, 68)">
      <rect width="12" height="12" rx="3" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1.5"/>
      <circle cx="6" cy="6" r="2.5" fill="#06b6d4"/>
      <text x="22" y="10" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2.5">SYS.AI // AUTONOMOUS WORKSPACES &amp; DAG ORCHESTRATION</text>
    </g>

    <!-- Main Title -->
    <text x="80" y="142" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
      XYANNCAT
    </text>

    <!-- Gradient Accent Underline -->
    <rect x="80" y="156" width="340" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Subtitle Role -->
    <text x="80" y="196" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">
      AI Systems Architect &amp; Agentic Engineer
    </text>

    <!-- Focus Description -->
    <text x="80" y="226" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0.2">
      Architecting Multi-Agent Task Graphs · 5-Layer AI Memory Engines · Model Forensics
    </text>

    <!-- Futuristic Capability Badges Container -->
    <g transform="translate(80, 258)">
      <!-- Badge 1: Multi-Agent DAGs -->
      <g transform="translate(0, 0)">
        <rect width="180" height="32" rx="16" fill="#1e1b4b" fill-opacity="0.8" stroke="#6366f1" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#818cf8"/>
        <text x="28" y="20.5" fill="#e0e7ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600">DAG ORCHESTRATION</text>
      </g>

      <!-- Badge 2: Multi-LLM Routing -->
      <g transform="translate(192, 0)">
        <rect width="165" height="32" rx="16" fill="#083344" fill-opacity="0.8" stroke="#0891b2" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#22d3ee"/>
        <text x="28" y="20.5" fill="#cffafe" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600">NVIDIA NIM / GROQ</text>
      </g>

      <!-- Badge 3: Forensic Forensics -->
      <g transform="translate(369, 0)">
        <rect width="170" height="32" rx="16" fill="#311333" fill-opacity="0.8" stroke="#c026d3" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#e879f9"/>
        <text x="28" y="20.5" fill="#fae8ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600">MLOPS FORENSICS</text>
      </g>
    </g>
  </g>

  <!-- High-Tech Outer Border -->
  <rect x="0.5" y="0.5" width="1279" height="359" rx="15.5" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1"/>
</svg>
