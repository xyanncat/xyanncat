<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-labelledby="title desc">
  <title id="title">xyanncat live system pulse</title>
  <desc id="desc">Animated status strip for the GitHub profile.</desc>
  <defs>
    <linearGradient id="pulseLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#6d28d9"/>
      <stop offset="0.5" stop-color="#0891b2"/>
      <stop offset="0.82" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="112" rx="18" fill="#f8fafc" fill-opacity="0.92"/>
  <rect x="1" y="1" width="1198" height="110" rx="17" fill="none" stroke="#7c3aed" stroke-opacity="0.35"/>
  <line x1="72" y1="58" x2="1128" y2="58" stroke="url(#pulseLine)" stroke-width="2"/>
  <line x1="72" y1="58" x2="1128" y2="58" stroke="#312e81" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 16">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.6s" repeatCount="indefinite"/>
  </line>
  <circle cx="180" cy="58" r="5" fill="#7c3aed">
    <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="58" r="5" fill="#0891b2">
    <animate attributeName="r" values="4;8;4" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="58" r="5" fill="#e11d48">
    <animate attributeName="r" values="4;8;4" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="38" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="4" fill="#1e1b4b">LIVE SYSTEM PULSE</text>
  <text x="600" y="88" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing="1.5" fill="#4c1d95">AGENT INFRASTRUCTURE  ·  DIAGNOSTICS  ·  PRODUCT SYSTEMS</text>
</svg>
